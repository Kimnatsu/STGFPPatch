<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>설정 — FPP v2</title>
<meta name="description" content="FPP v2 설정" />
<link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1626'/%3E%3Cpath d='M32 12c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
(function(){try{var t=localStorage.getItem('fpp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/Setting.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/sdk.js"></script>
</head>
<body data-page="setting">

<div class="ambient" aria-hidden="true"></div>

<header id="appHeader" class="app-header"></header>
<nav id="desktopNav" class="desk-nav" aria-label="주 메뉴"></nav>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="navDrawer" aria-label="전체 메뉴" aria-hidden="true"></aside>

<main id="view">
  <div class="wrap setting-wrap">
    <div class="setting-head rv">
      <h1 class="setting-title">설정</h1>
      <p class="setting-sub">알림 · 테마 · 언어 · 앱 아이콘 · 공지사항을 관리합니다. 설정값은 Firebase 사용자 정보에 저장됩니다.</p>
    </div>

    <div class="set-list rv" role="list">
      <button class="set-item" data-set="notify" type="button" role="listitem">
        <span class="set-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0" stroke-linejoin="round"/></svg></span>
        <span class="set-tx"><strong>알림 설정</strong><small>패치노트 · 즐겨찾기 · 이벤트 · 댓글 알림 ON/OFF</small></span>
        <span class="set-ar" aria-hidden="true">›</span>
      </button>
      <button class="set-item" data-set="theme" type="button" role="listitem">
        <span class="set-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5z" stroke-linejoin="round"/></svg></span>
        <span class="set-tx"><strong>테마 변경</strong><small>다크 / 라이트 — 선택 즉시 적용</small></span>
        <span class="set-ar" aria-hidden="true">›</span>
      </button>
      <button class="set-item" data-set="lang" type="button" role="listitem">
        <span class="set-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 2.6 4 5.7 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.7-4-9s1.3-6.4 4-9z"/></svg></span>
        <span class="set-tx"><strong>언어 변경</strong><small>한국어 / English</small></span>
        <span class="set-ar" aria-hidden="true">›</span>
      </button>
      <button class="set-item" data-set="appIcon" type="button" role="listitem">
        <span class="set-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 13.5l2.2 2.2L15.5 11" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="set-tx"><strong>앱 아이콘 변경</strong><small>바탕화면 바로가기 아이콘을 선택하세요</small></span>
        <span class="set-ar" aria-hidden="true">›</span>
      </button>
      <button class="set-item" data-set="notice" type="button" role="listitem">
        <span class="set-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
        <span class="set-tx"><strong>공지사항</strong><small>운영팀이 등록한 공지를 확인하세요</small></span>
        <span class="set-ar" aria-hidden="true">›</span>
      </button>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap foot-in">
    <span class="foot-logo">FPP</span>
    <p>FPP v2 — 팬 커뮤니티 · 본 사이트는 비공식 팬 프로젝트입니다.</p>
  </div>
</footer>

<nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/Firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/Setting.js"></script>
</body>
</html>
