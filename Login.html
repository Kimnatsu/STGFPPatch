<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>로그인 — FPP v2</title>
<meta name="description" content="FPP v2 로그인 / 회원가입" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1626'/%3E%3Cpath d='M32 12c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z' fill='%23f5b942'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
(function(){try{var t=localStorage.getItem('fpp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/Login.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/sdk.js"></script>
</head>
<body data-page="login">

<div class="ambient" aria-hidden="true"></div>
<div class="sea-lines" aria-hidden="true"></div>

<main class="login-stage">
  <a class="login-logo" href="Main.html" aria-label="FPP 홈으로">
    <span class="login-logo-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="3"/><path d="M32 12c-8 0-14 6-14 13 0 5 3 9 7 11v6l4-2 3 3 3-3 4 2v-6c4-2 7-6 7-11 0-7-6-13-14-13z" fill="currentColor" opacity=".92"/><circle cx="26" cy="25" r="3.4" fill="var(--bg,#0a1626)"/><circle cx="38" cy="25" r="3.4" fill="var(--bg,#0a1626)"/><path d="M27 33h10" stroke="var(--bg,#0a1626)" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <span class="login-logo-txt">FPP</span>
  </a>

  <h1 class="login-title" id="loginTitle">로그인</h1>
  <p class="login-sub" id="loginSub">그랜드 라인 항해 기록에 오신 것을 환영합니다</p>

  <!-- ===== 로그인 폼 ===== -->
  <section class="login-card rv" id="formLogin">
    <label class="fld">
      <span class="fld-lb">아이디 (이메일)</span>
      <input id="liEmail" type="email" autocomplete="username" placeholder="email@example.com" />
    </label>
    <label class="fld">
      <span class="fld-lb">비밀번호</span>
      <input id="liPw" type="password" autocomplete="current-password" placeholder="비밀번호" />
    </label>
    <button class="btn btn--gold btn--block" id="btnLogin" type="button">로그인</button>
    <div class="login-links">
      <button class="lk" id="btnFind" type="button">로그인 정보 찾기</button>
      <button class="lk" id="btnToSignup" type="button">회원가입</button>
    </div>
    <div class="or-line"><span>또는</span></div>
    <button class="btn btn--google btn--block" id="btnGoogle1" type="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Google 로그인
    </button>
    <div class="demo-line">
      <button class="btn btn--ghost btn--sm" id="btnDemoLogin" type="button">데모 계정으로 둘러보기</button>
    </div>
  </section>

  <!-- ===== 회원가입 초기 화면 ===== -->
  <section class="login-card rv" id="formSignupIntro" hidden>
    <button class="btn btn--gold btn--block" id="btnEmailSignup" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 7l8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      이메일로 시작
    </button>
    <div class="or-line"><span>또는</span></div>
    <button class="btn btn--google btn--block" id="btnGoogle2" type="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Google 로그인
    </button>
    <div class="login-links login-links--center">
      <button class="lk" id="btnToLogin" type="button">이미 계정이 있으신가요? 로그인</button>
    </div>
  </section>

  <!-- ===== 이메일 회원가입 폼 ===== -->
  <section class="login-card rv" id="formSignup" hidden>
    <label class="fld"><span class="fld-lb">아이디 (이메일)</span>
      <input id="suEmail" type="email" autocomplete="email" placeholder="email@example.com" /></label>
    <label class="fld"><span class="fld-lb">비밀번호</span>
      <input id="suPw" type="password" autocomplete="new-password" placeholder="6자 이상" /></label>
    <label class="fld"><span class="fld-lb">비밀번호 확인</span>
      <input id="suPw2" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력" /></label>
    <label class="fld"><span class="fld-lb">닉네임</span>
      <input id="suNick" type="text" maxlength="16" placeholder="사용할 닉네임" /></label>
    <div class="fld">
      <span class="fld-lb">이메일 인증번호</span>
      <div class="fld-row">
        <input id="suCode" type="text" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리" />
        <button class="btn btn--ghost btn--sm" id="btnSendCode" type="button">인증 전송</button>
      </div>
      <p class="fld-hint" id="codeHint">가입 전 이메일 인증이 필요합니다. 인증 전송을 눌러주세요.</p>
    </div>
    <button class="btn btn--gold btn--block" id="btnSignup" type="button">가입하기</button>
    <div class="login-links login-links--center">
      <button class="lk" id="btnBackIntro" type="button">뒤로가기</button>
    </div>
  </section>
</main>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/Firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/Login.js"></script>
</body>
</html>
